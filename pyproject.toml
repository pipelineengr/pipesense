[project]
name = "pipesense"
version = "0.2.0"
description = "Tool for pipeline production real-time data acquisition, analysis, historical simulation and leak detection."
readme = "README.md"
requires-python = "~=3.12"
license = { text = "MIT" }
keywords = ["opc-ua", "scada", "anomaly-detection", "time-series", "industrial"]
dependencies = ["pyyaml>=6.0", "pandas>=2.0",]

[project.scripts]
pipesense = "pipesense.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "hypothesis>=6.0",
    "pyyaml>=6.0",
    "asyncua>=1.0",
    "numpy>=1.26",
    "h5py>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]                         
line-length = 88               
target-version = "py310"                        # Python 3.10 or above is needed

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]             # Checks for Errors, warnings, Pyflakes logical errors, import sorting and pyupgrade 
ignore = ["E501"]                               # Line length violations are ignored

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v"                               # Adding this for some additional logging during testing
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pipesense"]

[tool.coverage.report]
show_missing = true
fail_under = 50